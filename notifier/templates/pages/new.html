{% extends "whatsapp/templates/pages/base.html" %}

{% block content %}

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Inter, Helvetica, Arial, sans-serif; background-color: #f5f5f5; color: #333; }
    
    /* Page Content */
    .form-container { 
        background: white; 
        border-radius: 0.75rem; 
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); 
        overflow: hidden; 
        max-width: 100%;
        margin: 0 auto;
    }
    
    .form-header { 
        padding: 1.5rem 2rem; 
        border-bottom: 1px solid #e5e5e5; 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        background: #f5f5f5;
    }
    
    .form-title { 
        font-size: 1.5rem; 
        font-weight: 600; 
        color: #262626; 
        margin: 0; 
        font-family: Inter, Helvetica, Arial, sans-serif;
    }
    
    .form-content { 
        height: 100vh; 
        min-height: 600px; 
        position: relative;
    }
    
    .iframe-container { 
        width: 100%; 
        height: 100%; 
        position: relative;
    }
    
    .iframe-container iframe { 
        width: 100%; 
        height: 100%; 
        border: none; 
        display: block;
    }
    
    .loading-indicator { 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        height: 100%; 
        color: #737373; 
        font-size: 1rem; 
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: white;
        z-index: 10;
        font-family: Inter, Helvetica, Arial, sans-serif;
    }
    
    .loading-spinner { 
        width: 24px; 
        height: 24px; 
        border: 3px solid #e5e5e5; 
        border-top: 3px solid #25D366; 
        border-radius: 50%; 
        animation: spin 1s linear infinite; 
        margin-right: 1rem; 
    }
    
    @keyframes spin { 
        0% { transform: rotate(0deg); } 
        100% { transform: rotate(360deg); } 
    }
    
    .back-link:hover {
        text-decoration: underline;
    }
    
    /* Mobile responsive - Material Dashboard */
    @media (max-width: 768px) {
        .form-header {
            padding: 1.25rem 1.5rem;
            flex-direction: column;
            gap: 1.25rem;
            align-items: flex-start;
        }
        
        .header-actions {
            width: 100%;
            justify-content: flex-end;
        }
        
        .form-content {
            height: 100vh;
        }
    }
</style>

    
    
    <div class="container-fluid py-4">
        
        <div class="card mb-1 pb-2">
            <div class="card-header pb-0 d-flex justify-content-between align-items-center flex-wrap">
                <div>
                    <h6 class="mb-0">{{ title }}</h6>
                </div>
            </div>
                
        </div>
        
        <div class="form-content">
            <div class="iframe-container">
                <div class="loading-indicator" id="loadingIndicator">
                    <div class="loading-spinner"></div>
                    Loading {{ title }} details...
                </div>
                <iframe src="{{base_url}}/{{url}}/new" id="employeeForm" onload="hideLoading()"></iframe>
            </div>
        </div>
    </div>

<script>
    function hideLoading() {
        const loadingIndicator = document.getElementById('loadingIndicator');
        if (loadingIndicator) {
            loadingIndicator.style.display = 'none';
        }
    }

    // Handle iframe load errors
    document.getElementById('employeeForm').addEventListener('error', function() {
        const loadingIndicator = document.getElementById('loadingIndicator');
        if (loadingIndicator) {
            loadingIndicator.innerHTML = '<div style="color: #F44335;">Error loading {{ title }} details. Please check the URL and try again.</div>';
        }
    });

    // Handle iframe load timeout
    setTimeout(function() {
        const loadingIndicator = document.getElementById('loadingIndicator');
        if (loadingIndicator && loadingIndicator.style.display !== 'none') {
            loadingIndicator.innerHTML = '<div style="color: #fb8c00;">Loading is taking longer than expected. Please wait...</div>';
        }
    }, 50000);
</script>

{% endblock %}
