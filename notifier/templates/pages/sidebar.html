{% block style %}
<style>
    :root {
        --brand-green: #25D366;
        --brand-green-600: #20C997;
        --brand-green-700: #1EA085;
        
        /* Professional Dark Theme Colors */
        --dark-bg: #1E293B;
        --dark-bg-secondary: #334155;
        --dark-bg-tertiary: #475569;
        --text-white: #FFFFFF;
        --text-gray: #CBD5E1;
        --text-muted: #94A3B8;
        
        /* Typography */
        --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        --font-size-sm: 0.875rem;
        --font-size-base: 1rem;
        --font-size-lg: 1.125rem;
        --font-size-xl: 1.25rem;
        
        /* Spacing */
        --spacing-1: 0.25rem;
        --spacing-2: 0.5rem;
        --spacing-3: 0.75rem;
        --spacing-4: 1rem;
        --spacing-5: 1.25rem;
        --spacing-6: 1.5rem;
        
        /* Border Radius */
        --radius-sm: 0.375rem;
        --radius-md: 0.5rem;
        --radius-lg: 0.75rem;
    }

    /* Sidebar container - Professional Dark Theme */
    .jk-sidebar-books {
        width: 260px;
        height: 100vh;
        background: var(--dark-bg);
        color: var(--text-white);
        position: fixed;
        left: 0;
        top: 0;
        z-index: 1001;
        display: flex;
        flex-direction: column;
        font-family: var(--font-family);
        transition: all 0.2s ease;
        border-right: 1px solid var(--dark-bg-secondary);
    }

    /* Sidebar Header with Logo */
    .jk-sidebar-header {
        padding: var(--spacing-4) var(--spacing-4);
        border-bottom: 1px solid var(--dark-bg-secondary);
        background: var(--dark-bg);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 80px;
    }

    .whatsapp-logo {
        width: 48px;
        height: 48px;
        color: var(--brand-green);
    }

    .whatsapp-logo svg {
        width: 100%;
        height: 100%;
        fill: currentColor;
    }

    /* Navigation */
    .jk-sidebar-nav {
        flex: 1;
        overflow-y: auto;
        padding: var(--spacing-4) var(--spacing-3);
    }

    .jk-sidebar-nav::-webkit-scrollbar {
        width: 4px;
    }

    .jk-sidebar-nav::-webkit-scrollbar-track {
        background: transparent;
    }

    .jk-sidebar-nav::-webkit-scrollbar-thumb {
        background: var(--dark-bg-tertiary);
        border-radius: var(--radius-sm);
    }

    .jk-sidebar-nav::-webkit-scrollbar-thumb:hover {
        background: var(--text-muted);
    }

    .jk-nav-section {
        margin-bottom: var(--spacing-4);
    }

    .jk-nav-section:last-child {
        margin-bottom: var(--spacing-2);
    }

    .jk-nav-item {
        display: flex;
        align-items: center;
        gap: var(--spacing-3);
        padding: var(--spacing-3) var(--spacing-4);
        border-radius: var(--radius-md);
        color: var(--text-white);
        text-decoration: none;
        transition: all 0.2s ease;
        font-size: var(--font-size-sm);
        font-weight: 500;
        position: relative;
        margin: var(--spacing-1) 0;
        line-height: 1.4;
        border: 1px solid transparent;
        min-height: 40px;
    }

    .jk-nav-item:hover {
        background: var(--dark-bg-secondary);
        color: var(--text-white);
        border-color: transparent;
    }

    .jk-nav-item.active {
        background: var(--brand-green) !important;
        color: var(--text-white) !important;
        border-color: transparent !important;
        box-shadow: 0 2px 4px rgba(37, 211, 102, 0.3) !important;
        font-weight: 600 !important;
    }

    .jk-nav-item.active:hover {
        background: var(--brand-green-600) !important;
        box-shadow: 0 4px 8px rgba(37, 211, 102, 0.4) !important;
    }

    .jk-nav-item i {
        font-size: var(--font-size-base);
        width: 1.25rem;
        text-align: center;
        flex-shrink: 0;
        opacity: 0.9;
    }

    .jk-nav-item .jk-nav-arrow {
        margin-left: auto;
        opacity: 0.7;
        font-size: var(--font-size-sm);
        transition: transform 0.2s ease;
    }

    /* Submenu Styles */
    .jk-nav-item.has-submenu {
        cursor: pointer;
    }

    .jk-nav-item.has-submenu .jk-nav-arrow {
        transition: transform 0.2s ease;
    }

    .jk-nav-item.has-submenu.expanded .jk-nav-arrow {
        transform: rotate(90deg);
    }

    .jk-submenu {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.3s ease;
        margin-left: var(--spacing-4);
    }

    .jk-submenu.expanded {
        max-height: 400px;
    }

    .jk-submenu-item {
        display: flex;
        align-items: center;
        gap: var(--spacing-3);
        padding: var(--spacing-2) var(--spacing-4);
        color: var(--text-gray);
        text-decoration: none;
        transition: all 0.2s ease;
        font-size: var(--font-size-sm);
        font-weight: 500;
        border-radius: var(--radius-md);
        margin: var(--spacing-1) 0;
        line-height: 1.4;
        border: 1px solid transparent;
        position: relative;
        min-height: 36px;
    }

    .jk-submenu-item:hover {
        background: var(--dark-bg-secondary);
        color: var(--text-white);
        border-color: transparent;
    }

    .jk-submenu-item.active {
        background: var(--brand-green) !important;
        color: var(--text-white) !important;
        border-color: transparent !important;
        box-shadow: 0 2px 4px rgba(37, 211, 102, 0.3) !important;
        font-weight: 600 !important;
    }

    .jk-submenu-item.active:hover {
        background: var(--brand-green-600) !important;
        box-shadow: 0 4px 8px rgba(37, 211, 102, 0.4) !important;
    }

    .jk-submenu-item i {
        font-size: var(--font-size-sm);
        width: 1.25rem;
        text-align: center;
        opacity: 0.8;
        flex-shrink: 0;
    }

    /* Support Section */
    .jk-nav-support {
        margin-top: auto;
        padding: var(--spacing-4);
        border-top: 1px solid var(--dark-bg-secondary);
        background: var(--dark-bg);
    }

    .jk-nav-support .jk-nav-item {
        color: var(--text-muted);
        border-color: transparent;
    }

    .jk-nav-support .jk-nav-item:hover {
        color: var(--text-white);
        background: var(--dark-bg-secondary);
        border-color: transparent;
    }

    /* Mobile styles */
    @media (max-width: 1024px) {
        .jk-sidebar-books {
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            width: 280px;
        }

        .jk-sidebar-books.show {
            transform: translateX(0);
        }
    }
</style>
{% endblock %}

    <nav class="jk-sidebar-nav">
        <!-- Main Section -->
        <div class="jk-nav-section">
            <a href="/whatsapp" class="jk-nav-item {% if active_page == 'dashboard' %}active{% endif %}">
                <i class="fas fa-home"></i>
                Dashboard
            </a>
        </div>

        <!-- WhatsApp Section -->
        <div class="jk-nav-section">
            <a href="/whatsapp/messages" class="jk-nav-item {% if active_page == 'messages' %}active{% endif %}">
                <i class="fas fa-message"></i>
                Messages
            </a>
            <a href="/whatsapp/broadcast" class="jk-nav-item {% if active_page == 'broadcast' %}active{% endif %}">
                <i class="fas fa-broadcast-tower"></i>
                Broadcast
            </a>
            <a href="/whatsapp/contact" class="jk-nav-item {% if active_page == 'contacts' %}active{% endif %}">
                <i class="fas fa-address-book"></i>
                Contacts
            </a>
            <a href="/whatsapp/contact-group" class="jk-nav-item {% if active_page == 'contact-groups' %}active{% endif %}">
                <i class="fas fa-users"></i>
                Contact Groups
            </a>

    </nav>

    <!-- Support Section -->
    <div class="jk-nav-support">
        <a href="/whatsapp/support" class="jk-nav-item {% if active_page == 'support' %}active{% endif %}">
            <i class="fas fa-life-ring"></i>
            Contact Support
        </a>
    </div>
</aside>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const submenuTriggers = document.querySelectorAll('.jk-nav-item.has-submenu');
    
    // Toggle submenu function
    function toggleSubmenu(e) {
        e.preventDefault();
        const submenu = e.currentTarget.nextElementSibling;
        const isExpanded = e.currentTarget.classList.contains('expanded');
        
        // Close all other submenus
        submenuTriggers.forEach(trigger => {
            if (trigger !== e.currentTarget) {
                trigger.classList.remove('expanded');
                trigger.nextElementSibling.classList.remove('expanded');
            }
        });
        
        // Toggle current submenu
        e.currentTarget.classList.toggle('expanded');
        submenu.classList.toggle('expanded');
        
        // If this submenu was closed and is now being opened, scroll it into view
        if (!isExpanded) {
            setTimeout(() => submenu.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 100);
        }
    }

    // Add click events to submenu triggers
    submenuTriggers.forEach(trigger => {
        trigger.addEventListener('click', toggleSubmenu);
    });
});
</script>
